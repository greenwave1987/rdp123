name: NZ 临时部署

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "运行时间（分钟）"
        required: false
        default: "25"

  repository_dispatch:
    types: [open_nz]

env:
  DEFAULT_DURATION_MIN: 25

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 拉取并启动 Docker
        env:
          ARGO_AUTH: ${{ secrets.ARGO_AUTH }}
          ARGO_DOMAIN: ${{ secrets.ARGO_DOMAIN }}
          GT_TOKEN: ${{ secrets.GT_TOKEN }}
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          docker pull ghcr.io/greenwave1987/nz-hug:latest
          docker rm -f nz-hug 2>/dev/null || true
          docker run -d \
            --name nz-hug \
            --restart no \
            -e ARGO_AUTH="$ARGO_AUTH" \
            -e ARGO_DOMAIN="$ARGO_DOMAIN" \
            -e GITHUB_TOKEN="$GT_TOKEN" \
            -e GITHUB_REPO_OWNER="greenwave1987" \
            -e GITHUB_REPO_NAME="nezha-backup" \
            -e GITHUB_BRANCH="main" \
            -e ZIP_PASSWORD="$ZIP_PASSWORD" \
            -e NZ_UUID="97763ed1-dcc0-23da-d309-a4ae993d1b88" \
            ghcr.io/greenwave1987/nz-hug:latest

      - name: 查看容器状态
        run: |
          docker ps -a
          docker logs --tail 100 nz-hug

      - name: 持续打印容器日志
        run: |
          docker logs -f nz-hug &
          LOG_PID=$!
          trap 'kill $LOG_PID 2>/dev/null || true' EXIT

          while docker inspect -f '{{.State.Running}}' nz-hug 2>/dev/null | grep -q true; do
            sleep 10
          done

      - name: 保持运行
        shell: pwsh
        run: |
          $raw = "${{ github.event.client_payload.duration }}"
          if ([string]::IsNullOrWhiteSpace($raw)) {
              $raw = "${{ github.event.inputs.duration }}"
          }

          $min = if ([string]::IsNullOrWhiteSpace($raw) -or -not [int]::TryParse($raw, [ref]$null)) {
              [int]$env:DEFAULT_DURATION_MIN
          } else {
              [int]$raw
          }

          $min = [Math]::Min($min, 355)
          $endTime = (Get-Date).AddMinutes($min)

          Write-Host "⏳ 保持运行 $min 分钟"
          Write-Host "⏰ 结束时间: $endTime"

          while ((Get-Date) -lt $endTime) {
              $rem = [int]($endTime - (Get-Date)).TotalMinutes
              Write-Host "$(Get-Date -Format 'HH:mm:ss') 剩余 $rem 分钟"
              Start-Sleep 120
          }

      - name: 清理容器
        if: always()
        run: |
          docker rm -f nz-hug 2>/dev/null || true
          
      - name: 🧹 清理旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
